---
kind: pipeline
type: kubernetes
name: staging

# Pipeline steps
steps:
  - name: submodules
    image: alpine/git
    commands:
      - git submodule update --init --recursive

  - name: build-master
    image: plugins/docker
    pull: always
    settings:
      repo: docker.marxact.io/marxactdev/downloadservice
      context: .
      dockerfile: DownloadService/Dockerfile
      auto_tag: true
      registry: docker.marxact.io/marxactdev/downloadservice
      username: marxact-registry
      password: 2020dReGiStry-marxact
    depends_on:
      - submodules
    when:
      event: [push, pull_request, tag]
      branch: master
